# Memoria del daemon de Gradle. 3 GB alcanza para este proyecto.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Compilacion paralela de modulos y cache de build entre ejecuciones.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX obligatorio (soporte legacy ya no existe).
android.useAndroidX=true

# R class no transitiva: cada modulo solo ve SUS recursos. Builds mas rapidos.
android.nonTransitiveRClass=true

# Estilo de codigo oficial de Kotlin.
kotlin.code.style=official
